plugins {
    id "mk-platform"
}


version = "${minecraft_version}-${mk_chat_version}"
project.ext.mod_version = mk_chat_version
project.ext.dependentProjects = [
        project(":MKWidgets"),
        project(":MKCore")
]

apply from: '../common.gradle'

processResources {
    exclude '.cache'
    duplicatesStrategy(DuplicatesStrategy.FAIL)
}

sourceSets {
    main {
        resources {
            srcDir 'src/generated/resources'
            exclude('.cache')
        }
    }
}

idea.module {
    excludeDirs << file("run")
}
