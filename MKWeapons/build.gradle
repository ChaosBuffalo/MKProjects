plugins {
    id 'idea'
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version "${mdg_version}"
}


version = "${minecraft_version}-${mk_weapons_version}"
project.ext.mod_version = mk_weapons_version
project.ext.dependentProjects = [
        project(":TargetingAPI"),
        project(":MKWidgets"),
        project(":MKCore")
]
project.ext.extra_properties = [
        curios_version: curios_version
]

apply from: '../common.gradle'

dependencies {
    localRuntime "mezz.jei:jei-${minecraft_version}-neoforge:${jei_version}"
    implementation "top.theillusivec4.curios:curios-neoforge:${curios_version}"
}
