plugins {
    id "mk-platform"
}


version = "${minecraft_version}-${mk_weapons_version}"
project.ext.mod_version = mk_weapons_version
project.ext.dependentProjects = [
        project(":TargetingAPI"),
        project(":MKWidgets"),
        project(":MKCore")
]

apply from: '../common.gradle'

// MKWeapons extra deps
repositories {
    maven {
        // location of the maven that hosts JEI files
        name = "Progwml6 maven"
        url = "https://maven.blamejared.com/"
    }
    maven {
        // new host for curios
        name = "OctoStudios"
        url = uri("https://maven.octo-studios.com/releases")
    }
}

dependencies {
    runtimeOnly "mezz.jei:jei-${minecraft_version}-neoforge:${jei_version}"
    implementation "top.theillusivec4.curios:curios-neoforge:${curios_version}"
}
