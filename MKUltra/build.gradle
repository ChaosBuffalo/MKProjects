plugins {
    id "mk-platform"
}


version = "${minecraft_version}-${mk_ultra_version}"
project.ext.mod_version = mk_ultra_version
project.ext.dependentProjects = [
        project(":TargetingAPI"),
        project(":MKWidgets"),
        project(":MKCore"),
        project(":MKChat"),
        project(":MKFaction"),
        project(":MKWeapons"),
        project(":MKNpc")
]

apply from: '../common.gradle'

neoForge {
    runs {
        data {
            programArguments.addAll '--existing-mod', 'mkweapons'
        }
    }
}

idea.module {
    excludeDirs << file("run")
}
