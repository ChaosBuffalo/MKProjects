modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="${mod_authors}"
description='''${mod_description}'''

[[dependencies.${mod_id}]]
modId="neoforge"
type="required"
versionRange="${neo_version_range}"
ordering="AFTER"
side="BOTH"

[[dependencies.${mod_id}]]
modId="minecraft"
type="required"
versionRange="${minecraft_version_range}"
ordering="AFTER"
side="BOTH"

[[dependencies.${mod_id}]]
modId="mkworkspaceruntime"
type="required"
versionRange="[${mk_workspace_runtime_version},)"
ordering="AFTER"
side="BOTH"

[[dependencies.${mod_id}]]
modId="mknpc"
type="required"
versionRange="[${mk_npc_version},)"
ordering="AFTER"
side="BOTH"

[[dependencies.${mod_id}]]
modId="mkwidgets"
type="required"
versionRange="[${mk_widgets_version},)"
ordering="AFTER"
side="BOTH"
