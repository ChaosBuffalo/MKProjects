plugins {
    id "mk-platform"
}


version = "${minecraft_version}-${mk_npc_version}"
project.ext.mod_version = mk_npc_version
project.ext.dependentProjects = [
        project(":TargetingAPI"),
        project(":MKWidgets"),
        project(":MKCore"),
        project(":MKChat"),
        project(":MKFaction"),
        project(":MKWeapons")
]

neoForge {
    validateAccessTransformers = true
}


// FIXME: why do we need the MKWeapons extra deps here?
repositories {
    maven {
        // location of the maven that hosts JEI files
        name = "Progwml6 maven"
        url = "https://maven.blamejared.com/"
    }
    maven {
        // new host for curios
        name = "OctoStudios"
        url = uri("https://maven.octo-studios.com/releases")
    }
}



apply from: '../common.gradle'

idea.module {
    excludeDirs << file("run")
}
