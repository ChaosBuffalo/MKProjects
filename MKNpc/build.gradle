plugins {
    id "mk-platform"
}


version = "${minecraft_version}-${mk_npc_version}"
project.ext.mod_version = mk_npc_version
project.ext.dependentProjects = [
        project(":TargetingAPI"),
        project(":MKWidgets"),
        project(":MKCore"),
        project(":MKChat"),
        project(":MKFaction"),
        project(":MKWeapons")
]

apply from: '../common.gradle'

neoForge {
    validateAccessTransformers = true
}

processResources {
    exclude '.cache'
    duplicatesStrategy(DuplicatesStrategy.FAIL)
}

sourceSets {
    main {
        resources {
            srcDir 'src/generated/resources'
            exclude('.cache')
        }
    }
}

idea.module {
    excludeDirs << file("run")
}
