plugins {
    id 'idea'
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version "${mdg_version}"
}


version = "${minecraft_version}-${mk_faction_version}"
project.ext.mod_version = mk_faction_version
project.ext.dependentProjects = [
        project(":TargetingAPI"),
        project(":MKWidgets"),
        project(":MKCore")
]

apply from: '../common.gradle'

dependencies {

    gradle.taskGraph.whenReady { graph ->
        if (graph.hasTask(runData)) {
            implementation "maven.modrinth:uranus:fOkq6VwW"
            implementation "maven.modrinth:jupiter:6FVn8sRM"
            implementation "maven.modrinth:iceandfire-ce:vS8ELZ5k"
        }
    }
}